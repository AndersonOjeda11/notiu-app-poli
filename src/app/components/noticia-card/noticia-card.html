@let n = noticia();
<div class="card h-100 shadow-sm">
  <img [src]="n.imagen" class="card-img-top" [alt]="n.titulo" loading="lazy" />
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="badge" [class]="n.categoria | categoriaClase">{{ n.categoria }}</span>
      <small class="text-body-secondary">{{ n.fecha | date: 'mediumDate' }}</small>
    </div>
    <h5 class="card-title">{{ n.titulo }}</h5>
    <p class="card-text text-body-secondary small flex-grow-1">{{ n.descripcion }}</p>
    <div class="d-flex justify-content-between align-items-center">
      <a class="btn btn-primary btn-sm" [routerLink]="['/noticias', n.id]">Ver más</a>
      <button
        type="button"
        class="btn btn-sm"
        [class]="favoritos.esFavorita(n.id) ? 'btn-danger' : 'btn-outline-danger'"
        [attr.aria-label]="favoritos.esFavorita(n.id) ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        [attr.aria-pressed]="favoritos.esFavorita(n.id)"
        (click)="favoritos.alternar(n.id)"
      >
        <i class="bi" [class]="favoritos.esFavorita(n.id) ? 'bi-heart-fill' : 'bi-heart'"></i>
      </button>
    </div>
  </div>
</div>
