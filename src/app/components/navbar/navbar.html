<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="bi bi-newspaper text-primary me-1"></i> NotiU
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuPrincipal"
      aria-controls="menuPrincipal"
      aria-expanded="false"
      aria-label="Abrir menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >Inicio</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/noticias" routerLinkActive="active">Noticias</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/favoritos" routerLinkActive="active">
            Favoritos
            @if (favoritos.cantidad() > 0) {
              <span class="badge rounded-pill text-bg-primary">{{ favoritos.cantidad() }}</span>
            }
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contacto" routerLinkActive="active">Contacto</a>
        </li>
        @if (auth.esAdmin()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin" routerLinkActive="active">Administrar</a>
          </li>
        }
      </ul>

      <div class="d-flex align-items-center gap-3">
        @if (auth.usuario(); as usuario) {
          <span class="text-light small">
            <i class="bi bi-person-circle me-1"></i>Hola, {{ usuario.nombre }}
          </span>
          <button type="button" class="btn btn-outline-light btn-sm" (click)="salir()">
            Salir
          </button>
        } @else {
          <a class="btn btn-outline-light btn-sm" routerLink="/login">
            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
          </a>
        }
      </div>
    </div>
  </div>
</nav>
